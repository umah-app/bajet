<h2 mat-dialog-title>Add a new entry</h2>
<mat-dialog-content>
  <p></p>
  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput [(ngModel)]="title" />
  </mat-form-field>
  <!-- <mat-form-field appearance="outline">
    <mat-label>Category</mat-label>
    <input matInput />
  </mat-form-field> -->
  <mat-form-field appearance="outline">
    <mat-label>Amount</mat-label>
    <input matInput type="number" step="0.01" min="0" [(ngModel)]="amount" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="null">Cancel</button>
  <button mat-button [mat-dialog-close]="entry()">Save</button>
</mat-dialog-actions>
